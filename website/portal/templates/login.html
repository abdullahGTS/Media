<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="utf-8" />
    <meta name="description" content="gts" />
    <meta name="author" content="Abdullah kamal" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Payment | Sign In</title>
    <meta content="width=device-width, initial-scale=1.0, shrink-to-fit=no" name="viewport" />
    <link rel="icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon" />

    <!-- Fonts and icons -->
    <script src="{% static 'js/plugin/webfont/webfont.min.js' %}"></script>
    <script>
        WebFont.load({
            google: { families: ["Public Sans:300,400,500,600,700"] },
            custom: {
                families: [
                    "Font Awesome 5 Solid",
                    "Font Awesome 5 Regular",
                    "Font Awesome 5 Brands",
                    "simple-line-icons",
                ],
                urls: ["{% static 'css/fonts.min.css' %}"],
            },
            active: function () {
                sessionStorage.fonts = true;
            },
        });
    </script>

    <!-- CSS Files -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/kaiadmin.min.css' %}" />
    <link href="{% static 'fontawesomefree/css/all.min.css' %}" rel="stylesheet" type="text/css">
    <link href="{% static 'css/login.css' %}" rel="stylesheet" type="text/css">

    <script src="{% static 'js/lottie.min.js' %}" type="text/javascript"></script>
</head>

<body>
    <div class="row login-container">
        <div class="col-md-5 col-lg-5 col-12 d-flex justify-content-center align-items-center flex-column">
            <div class="row w-100 mb-5 mt-5">
                <div class="col-md-12 d-flex justify-content-center align-items-center">
                    <img class="gts-logo" src="{% static 'img/gts-logo.png' %}" alt="GTS-LOGO">
                </div>
            </div>
            <div class="row w-100 mb-1">
                <div class="col-md-12 d-flex justify-content-center align-items-center">
                    <h2 class="text-white pms-heading">Payment Management System</h2>
                </div>
            </div>
            <div class="row w-100 mb-3">
                <div class="col-md-12 d-flex justify-content-center align-items-center">
                    <h2 class="text-white singin-heading">Sign In</h2>
                </div>
            </div>
            <div class="row w-100">
                <div class="col-md-12">
                    <div class="card bg-transparent login-card">
                        <div class="row mb-3">
                            <div class="col-md-12">
                                <div class="form-group p-0">
                                    <label for="email" class="text-white">E-Mail</label>
                                    <div class="input-group">
                                        <span class="input-group-text" id="pre_email"><i
                                                class="fa-solid fa-envelope"></i></span>
                                        <input type="text" class="form-control" placeholder="Type your email"
                                            aria-label="email" aria-describedby="pre_email" id="email">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-12">
                                <div class="form-group p-0">
                                    <label for="password" class="text-white">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text" id="pre_password"><i
                                                class="fa-solid fa-lock"></i></span>
                                        <input type="password" class="form-control" placeholder="Password"
                                            aria-label="password" aria-describedby="pre_password" id="password">
                                        <span class="input-group-text" id="view_password"><i
                                            class="fa-solid fa-eye"></i></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-3 d-none" id="otpRow">
                            <div class="col-md-12">
                                <div class="form-group p-0">
                                    <label for="otp" class="text-white">OTP</label>
                                    <div class="input-group">
                                        <span class="input-group-text" id="pre_otp"><i
                                                class="fa-solid fa-key"></i></span>
                                        <input type="text" class="form-control" placeholder="Type your received OTP"
                                            aria-label="otp" aria-describedby="pre_otp" id="otp">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row mt-3 mb-3">
                            <div class="col-md-12 d-flex justify-content-center align-items-center">
                                <input type="hidden" id="csrfToken" value="{{csrf_token}}">
                                <button class="btn btn-custom-login px-5" id="getOTPBtn">Get OTP <i class="fa-solid fa-key"></i></button>
                                <button class="btn btn-custom-login px-5 d-none" id="signinBtn">Sign in <i class="fa-solid fa-arrow-right-to-bracket"></i></button>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12 d-flex justify-content-start align-items-center">
                                <a href="/forget/password/" class="text-white mb-3 forget-password">Forget Password...?</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    <!-- jQuery Scrollbar -->
